<link rel="stylesheet" href="plugins/localthings/core/template/css/localthings.widget.css">
<div class="eqLogic eqLogic-widget allowResize allowReorderCmd #custom_layout# #class# localthings-widget localthings-widget-dashboard"
     data-eqType="#eqType#" data-eqLogic_id="#id#" data-eqLogic_uid="#uid#" data-version="#version#"
     data-translate-category="#translate_category#" data-category="#category#" data-tags="#tags#"
    data-device-type="#device_type#" style="width:#width#;height:#height#;#style#">
    <center class="widget-name">
        <span class="cmd classTitreIcon health pull-left tippied" id="idHealth#uid#" data-cmd_id="#health_id#" data-online="#health_online#"
              data-title="{{Santé}} : #health_status#" style="display:#health_display#">
            <i class="#health_icon#" style="color:#health_color# !important"></i>
        </span>
        <span class="cmd classTitreIcon refreshInfo refresh localthings-refresh pull-right tippied cursor"
              data-cmd_id="#refresh_id#" data-title="{{Rafraîchir les informations LocalThings}}" style="display:#refresh_display#">
            <i class="fas fa-sync"></i>
        </span>
        <span class="reportModeVisible">#name_display# <span class="object_name">#object_name#</span></span>
        <a href="#eqLink#" class="reportModeHidden">#name_display# <span class="object_name">#object_name#</span></a>
    </center>

    <div class="localthings-widget-body">
        <ul class="nav nav-tabs localthings-widget-tabs" role="tablist">
            <li role="presentation" class="active">
                <button type="button" data-target="#localthings-main-#uid#" aria-controls="localthings-main-#uid#" role="tab" data-toggle="tab" title="{{Principal}}">
                    <i class="fas fa-home"></i><span>{{Principal}}</span>
                </button>
            </li>
            <li role="presentation" style="display:#maintenance_display#">
                <button type="button" data-target="#localthings-maintenance-#uid#" aria-controls="localthings-maintenance-#uid#" role="tab" data-toggle="tab" title="{{Entretien}}">
                    <i class="fas fa-tools"></i><span>{{Entretien}}</span>
                </button>
            </li>
            <li role="presentation" style="display:#energy_display#">
                <button type="button" data-target="#localthings-energy-#uid#" aria-controls="localthings-energy-#uid#" role="tab" data-toggle="tab" title="{{Consommation}}">
                    <i class="fas fa-bolt"></i><span>{{Consommation}}</span>
                </button>
            </li>
            <li role="presentation" style="display:#details_display#">
                <button type="button" data-target="#localthings-details-#uid#" aria-controls="localthings-details-#uid#" role="tab" data-toggle="tab" title="{{Informations}}">
                    <i class="fas fa-info-circle"></i><span>{{Informations}}</span>
                </button>
            </li>
        </ul>

        <div class="tab-content localthings-widget-pages">
            <div role="tabpanel" class="tab-pane active" id="localthings-main-#uid#">
                <div class="localthings-widget-status" style="display:#status_display#">#status_commands#</div>
                <section class="localthings-widget-section" style="display:#settings_display#">
                    <h4>#settings_title#</h4>
                    <div class="localthings-widget-command-grid">#settings_commands#</div>
                </section>
                <section class="localthings-widget-section" style="display:#controls_display#">
                    <h4>{{Actions}}</h4>
                    <div class="localthings-widget-command-grid localthings-widget-controls">#control_commands#</div>
                </section>
            </div>

            <div role="tabpanel" class="tab-pane" id="localthings-maintenance-#uid#">
                <section class="localthings-widget-section">
                    <h4>{{Entretien}}</h4>
                    <div class="localthings-widget-command-grid">#maintenance_commands#</div>
                </section>
            </div>

            <div role="tabpanel" class="tab-pane" id="localthings-energy-#uid#">
                <section class="localthings-widget-section">
                    <h4>{{Consommation}}</h4>
                    <div class="localthings-widget-command-grid">#energy_commands#</div>
                </section>
            </div>

            <div role="tabpanel" class="tab-pane" id="localthings-details-#uid#">
                <section class="localthings-widget-section">
                    <h4>{{Informations utiles}}</h4>
                    <div class="localthings-widget-command-grid localthings-widget-details">#detail_commands#</div>
                </section>
            </div>
        </div>
    </div>
</div>
<script>
(function () {
    var widget = document.querySelector('.eqLogic[data-eqLogic_uid="#uid#"]');
    if (!widget) return;
    var setToggleState = function (toggle, enabled) {
        toggle.checked = enabled;
        toggle.setAttribute('aria-checked', enabled ? 'true' : 'false');
        var container = toggle.closest('.localthings-widget-switch');
        var label = container ? container.querySelector('.localthings-widget-switch-state') : null;
        if (label) label.textContent = toggle.getAttribute(enabled ? 'data-on-label' : 'data-off-label');
    };
    var refresh = widget.querySelector('.localthings-refresh');
    if (refresh && refresh.getAttribute('data-bound') !== '1') {
        refresh.setAttribute('data-bound', '1');
        refresh.addEventListener('click', function () {
            jeedom.cmd.execute({id: this.getAttribute('data-cmd_id')});
        });
    }
    if (widget.getAttribute('data-toggle-bound') !== '1') {
        widget.setAttribute('data-toggle-bound', '1');
        widget.addEventListener('change', function (event) {
            var toggle = event.target.closest('.localthings-toggle-input');
            if (!toggle) return;
            var previousValue = !toggle.checked;
            setToggleState(toggle, toggle.checked);
            var commandId = toggle.getAttribute(toggle.checked ? 'data-on-cmd_id' : 'data-off-cmd_id');
            if (!commandId) {
                setToggleState(toggle, previousValue);
                return;
            }
            toggle.disabled = true;
            jeedom.cmd.execute({
                id: commandId,
                error: function (error) {
                    setToggleState(toggle, previousValue);
                    toggle.disabled = false;
                    jeedomUtils.showAlert({message: error.message || error, level: 'danger'});
                },
                success: function () {
                    toggle.disabled = false;
                }
            });
        });
    }
    widget.querySelectorAll('.localthings-toggle-input').forEach(function (toggle) {
        var stateId = toggle.getAttribute('data-state-cmd_id');
        if (!stateId || toggle.getAttribute('data-update-bound') === '1') return;
        toggle.setAttribute('data-update-bound', '1');
        jeedom.cmd.addUpdateFunction(stateId, function (_options) {
            var value = typeof _options.value !== 'undefined' ? _options.value : _options.display_value;
            var online = ['1', 'true', 'on', 'enable', 'enabled', 'yes'].indexOf(String(value).trim().toLowerCase()) !== -1;
            setToggleState(toggle, online);
        });
    });
    var health = widget.querySelector('.health[data-cmd_id="#health_id#"]');
    if (health && '#health_id#' !== '') {
        jeedom.cmd.addUpdateFunction('#health_id#', function (_options) {
            var value = typeof _options.display_value !== 'undefined' ? _options.display_value : _options.value;
            var online = Number(value) === 1;
            var icon = health.querySelector('i');
            health.setAttribute('data-online', online ? 'true' : 'false');
            health.setAttribute('data-title', online ? '{{Santé : En ligne}}' : '{{Santé : Hors ligne}}');
            icon.className = online ? 'fas fa-link' : 'fas fa-unlink';
            icon.style.setProperty('color', online ? '#4caf50' : '#d9534f', 'important');
        });
    }
})();
</script>
